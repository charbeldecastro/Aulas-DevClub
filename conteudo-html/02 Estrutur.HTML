<!-- Configurando a página html -->

<!DOCTYPE html> <!--efine a versão mais atual do HTML -->
<html lang="pt-br"> <!-- começa o site, indicando que está em português do Brasil -->

<head> <!-- configurações da página (parte invisível) -->

    <title>DevClub</title> <!-- título que aparece na aba do navegador -->
